info:
  description:
    "Liferay Commerce Admin Catalog API. A Java client JAR is available for use with the group ID 'com.liferay',
        artifact ID 'com.liferay.headless.commerce.admin.catalog.client', and version '4.0.14'."
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  title: Liferay Analytics DXP Entities Exporter
  version: v1.0
openapi: 3.0.1
paths:
components:
  schemas:
    Product:
      properties:
        active:
          example: true
          type: boolean
        catalogId:
          example: 30054
          format: int64
          minimum: 0
          type: integer
        categories:
          items:
            $ref: "#/components/schemas/Category"
          type: array
        customFields:
          description:
            The custom fields associated to the page that renders the Display Page Template.
          items:
            $ref: "../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#CustomField"
          type: array
        tags:
          example:
            - tag1
            - tag2
            - tag3
          items:
            type: string
          type: array
        workflowStatusInfo:
          allOf:
            - $ref: "#/components/schemas/Status"
          readOnly: true
      type: object
    Category:
      properties:
        externalReferenceCode:
          example: AB-34098-789-N
          type: string
        id:
          example: 30130
          format: int64
          minimum: 0
          type: integer
        name:
          description:
            Category Name
          type: string
        siteId:
          format: int64
          type: integer
        vocabulary:
          example: Default Vocabulary
          readOnly: true
          type: string
      required:
        - id
      type: object
