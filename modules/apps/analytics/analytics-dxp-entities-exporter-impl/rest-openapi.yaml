components:
    schemas:
        Category:
            properties:
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    description:
                        Category Name
                    type: string
                siteId:
                    format: int64
                    type: integer
                vocabulary:
                    example: Default Vocabulary
                    readOnly: true
                    type: string
            required:
                - id
            type: object
        Product:
            properties:
                active:
                    example: true
                    type: boolean
                catalogId:
                    example: 30054
                    format: int64
                    minimum: 0
                    type: integer
                categories:
                    items:
                        $ref: "#/components/schemas/Category"
                    type: array
                createDate:
                    example: 2017-07-21
                    format: date
                    type: string
#                customFields:
#                    description:
#                        The custom fields associated to the page that renders the Display Page Template.
#                    items:
#                        $ref: "../../headless-delivery/headless-delivery-impl/rest-openapi.yaml#CustomField"
#                    type: array
                description:
                    type: object
                    additionalProperties:
                        type: string
                    example:
                        hu_HU: Product Description HU
                        hr_HR: Product Description HR
                        en_US: Professional hand stainless steel saw for wood. Made to last and
                            saw forever. Made of best steel
                displayDate:
                    example: 2017-07-21
                    format: date
                    type: string
                expirationDate:
                    example: 2017-08-21
                    format: date
                    type: string
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                metaDescription:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Meta description HU
                        hr_HR: Meta description HU
                        hu_HU: Meta description HU
                    type: object
                metaKeyword:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Meta keyword HU
                        hr_HR: Meta keyword HU
                        hu_HU: Meta keyword HU
                    type: object
                metaTitle:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Meta title HU
                        hr_HR: Meta title HU
                        hu_HU: Meta title HU
                    type: object
                modifiedDate:
                    example: 2017-08-21
                    format: date
                    type: string
                name:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Hand Saw
                        hr_HR: Product Name HR
                        hu_HU: Product Name HU
                    type: object
                neverExpire:
                    example: true
                    type: boolean
                productChannels:
                    items:
                        $ref: "#/components/schemas/ProductChannel"
                    type: array
                productId:
                    format: int64
                    readOnly: true
                    type: integer
                productSpecifications:
                    items:
                        $ref: "#/components/schemas/ProductSpecification"
                    type: array
                productStatus:
                    format: int32
                    readOnly: true
                    type: integer
                productType:
                    example: simple
                    type: string
                skus:
                    items:
                        $ref: "#/components/schemas/Sku"
                    type: array
                tags:
                    example:
                        - tag1
                        - tag2
                        - tag3
                    items:
                        type: string
                    type: array
                workflowStatusInfo:
                    allOf:
                        - $ref: "#/components/schemas/Status"
                    readOnly: true
            required:
                - active
                - catalogId
                - name
                - productType
            type: object
        ProductChannel:
            properties:
                channelId:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                currencyCode:
                    example: USD
                    type: string
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    example: Alessio Antonio Rendina
                    type: string
                type:
                    type: string
            required:
                - id
            type: object
        ProductSpecification:
            properties:
                id:
                    example: 31130
                    format: int64
                    minimum: 0
                    type: integer
                label:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Hand Saw
                        hr_HR: Product Name HR
                        hu_HU: Product Name HU
                    type: object
                optionCategoryId:
                    example: 30129
                    format: int64
                    minimum: 0
                    type: integer
                priority:
                    example: 1.2
                    format: double
                    minimum: 0
                    type: number
                productId:
                    example: 30129
                    format: int64
                    minimum: 0
                    type: integer
                specificationId:
                    example: 30129
                    format: int64
                    minimum: 0
                    type: integer
                specificationKey:
                    example: specification-key
                    type: string
                value:
                    additionalProperties:
                        type: string
                    example:
                        en_US: Croatia
                        hr_HR: Hrvatska
                        hu_HU: Horvatorszag
                    type: object
            required:
                - specificationKey
                - value
            type: object
        Sku:
            properties:
                cost:
                    example: 101
                    format: bigdecimal
                    minimum: 0
                    type: number
                displayDate:
                    example: 2017-07-21
                    format: date
                    type: string
                expirationDate:
                    example: 2017-08-21
                    format: date
                    type: string
                externalReferenceCode:
                    example: AB-34098-789-N
                    type: string
                gtin:
                    example: "12341234"
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                manufacturerPartNumber:
                    example: "12341234"
                    type: string
                price:
                    example: 101
                    format: bigdecimal
                    minimum: 0
                    type: number
                sku:
                    example: "12341234"
                    type: string
            required:
                - sku
            type: object
        Status:
            properties:
                code:
                    format: int32
                    readOnly: true
                    type: integer
                label:
                    example: black
                    type: string
                label_i18n:
                    example: black
                    type: string
            type: object
info:
