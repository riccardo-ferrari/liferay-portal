components:
    schemas:
        Channel:
            properties:
                channelId:
                    type: string
                createDate:
                    format: date
                    type: string
                dataSources:
                    items:
                        $ref: "#/components/schemas/DataSource"
                    type: array
                name:
                    type: string
        DataSource:
            properties:
                commerceChannelIds:
                    items:
                        format: int64
                        type: integer
                    type: array
                dataSourceId:
                    type: string
                siteIds:
                    items:
                        format: int64
                        type: integer
                    type: array
        DataSourceToken:
            properties:
                token:
                    type: string
    securitySchemes:
        BasicAuth:
            scheme: basic
            type: http
        BearerAuth:
            scheme: bearer
            type: http
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: /oauth/authorize
                    scopes:
                        CommerceOpenApiAdmin.admin: Grants access to admin operations
                        CommerceOpenApiAdmin.read: Grants read access
                        CommerceOpenApiAdmin.write: Grants write access
                    tokenUrl: /oauth/token
            type: oauth2
info:
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: Liferay Analytics Settings REST
    version: v1.0
openapi: 3.0.1
paths:
    "/channel":
        get:
            operationId: getChannelPage
            parameters:
                - in: query
                  name: keywords
                  schema:
                      type: string
                - in: query
                  name: filter
                  schema:
                      type: string
                - in: query
                  name: page
                  schema:
                      type: integer
                - in: query
                  name: pageSize
                  schema:
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
            tags: ["Channel"]
    "/data-source":
        delete:
            operationId: deleteDataSource
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                    descritpion:
                        Disconnected
                500:
                    content:
                        application/json:
                            schema:
                            type: string
                        application/xml:
                            schema:
                            type: string
                    description:
                        Unexpected error
            tags: ["DataSource"]
        post:
            operationId: postDataSource
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DataSourceToken"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/DataSourceToken"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                    descritpion:
                        Connected
                500:
                    content:
                        application/json:
                            schema:
                            type: string
                        application/xml:
                            schema:
                            type: string
                    description:
                        Unexpected error
            tags: ["DataSource"]